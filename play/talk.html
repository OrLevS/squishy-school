<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>משחק דיבור</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/site.css?v=4">
<script src="../js/common.js?v=4"></script>
<script>loadWeek('../');</script>
<style>
  .center { text-align: center; }
  .pic { font-size: 130px; line-height: 1.1; }
  .step { font-size: 20px; margin: 12px 0; }
  .answer { min-height: 70px; }
  .bubble { display: inline-flex; gap: 10px; align-items: center; background: var(--cream); border-radius: 24px 24px 24px 6px; padding: 10px 18px; }
  .guide { display: flex; align-items: center; gap: 12px; justify-content: center; }
</style>
</head>
<body>
<div class="top"><a class="back" id="back" href="../w1/">→ לכל הפעילויות</a><span class="crumb">אנגלית · מדברים</span></div>
<main class="wrap">
  <h1 id="title"></h1>
  <p class="lead" id="lead"></p>
  <div class="card center" id="card"></div>
  <p class="hint" style="margin-top:16px">💡 לאמא: אחרי כמה כרטיסים מתחלפות. היא מצביעה על חפץ בבית ושואלת אותך. מותר לך לטעות בכוונה.</p>
</main>
<script>
const Wk = WEEKS[weekNo()], T = Wk.talk;
document.getElementById('back').href = `../w${Wk.n}/`;
const $ = id => document.getElementById(id);
$('title').innerHTML = `<span class="en">${T.q}</span>`;
$('lead').textContent = `${T.qHe} עונים בקול, ורק אז לוחצים לבדוק.`;
let i = 0;
function show() {
  const it = T.items[i];
  $('card').innerHTML = `
    <div class="guide">${squishySVG('#E9C46A', 70, 'wow')}<span class="bubble say" style="font-size:34px">${T.q} <button class="speak" id="q" aria-label="שומעים את השאלה">🔊</button></span></div>
    <div class="pic">${it.e}</div>
    <div class="step">🗣 עונים בקול: <span class="en" style="font-size:26px">${T.frame}</span></div>
    <div class="answer" id="ans"><button class="btn teal" id="reveal">👀 בודקים</button></div>`;
  $('q').onclick = () => say(T.q);
  $('reveal').onclick = () => {
    $('ans').innerHTML = `<div class="say" style="justify-content:center">${it.a}
      <button class="speak" id="a" aria-label="שומעים">🔊</button><button class="speak slow" id="as" aria-label="לאט">🐢</button></div>
      <div class="btn-row"><button class="btn" id="next">הבא ←</button></div>`;
    say(it.a);
    bounce(document.querySelector('.guide svg'));
    $('a').onclick = () => say(it.a);
    $('as').onclick = () => say(it.a, true);
    $('next').onclick = () => { i = (i + 1) % T.items.length; show(); };
  };
  setTimeout(() => say(T.q), 300);
}
show();
</script>
</body>
</html>
